<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="JobTrack Community">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<title>JobTrack · מעקב חיפוש עבודה</title>
<style>
:root {
  --bg:#f6f7fb; --panel:#ffffff; --border:#e6e9ef; --text:#1f2937; --muted:#6b7280;
  --primary:#0073ea; --primary-dk:#0060c2; --accent:#5559df;
  --st-saved:#a5a5a5; --st-applied:#579bfc; --st-phone:#a25ddc; --st-interview:#fdab3d;
  --st-offer:#00c875; --st-rejected:#e2445c; --st-withdrawn:#7e909a; --st-archived:#cfd2d9;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 18px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.12);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Heebo","Assistant",sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
:root[dir=rtl] .lr-flip{transform:scaleX(-1)}

/* Top bar */
.topbar{background:linear-gradient(135deg,#0073ea 0%,#5559df 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.topbar h1 .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.topbar h1 .sub{font-weight:400;opacity:.85;font-size:12px;margin-inline-start:8px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{background:#fff;color:var(--primary);border-color:#fff}
.btn.primary:hover{background:#f0f6ff}
.btn.danger{background:#e2445c;border-color:#e2445c}
.btn.ghost{background:transparent;border-color:#d2d6de;color:var(--text)}
.btn.ghost:hover{background:#f0f2f7}
.btn.success{background:#00c875;border-color:#00c875}
.btn.small{padding:5px 9px;font-size:11px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.15);font-size:12px;cursor:pointer}
.sync-chip:hover{background:rgba(255,255,255,.25)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#cfd2d9;display:inline-block}
.sync-dot.online{background:#00c875;animation:pulse 2s infinite}
.sync-dot.offline{background:#fdab3d}
.sync-dot.error{background:#e2445c}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.lang-toggle{display:inline-flex;background:rgba(255,255,255,.15);border-radius:14px;overflow:hidden;font-size:11px;font-weight:700}
.lang-toggle button{border:0;background:transparent;color:#fff;padding:5px 11px;cursor:pointer;opacity:.6}
.lang-toggle button.active{background:rgba(255,255,255,.85);color:var(--primary);opacity:1}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:18px 22px 4px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .value{font-size:26px;font-weight:700;margin-top:4px}
.stat.applied .value{color:var(--st-applied)}
.stat.interview .value{color:var(--st-interview)}
.stat.offer .value{color:var(--st-offer)}
.stat.rejected .value{color:var(--st-rejected)}
.stat .delta{font-size:11px;color:var(--muted);margin-top:2px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px;flex-wrap:wrap}
.toolbar input[type=search],.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text)}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:400px}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.view-toggle button{border:0;background:#fff;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.view-toggle button.active{background:var(--primary);color:#fff}
.spacer{flex:1}

.container{padding:0 22px 60px}

/* Table */
.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:#f6f7fb;text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{background:#eef1f6}
thead th .sort-arrow{opacity:.4;margin-inline-start:4px;font-size:10px}
thead th.sorted .sort-arrow{opacity:1;color:var(--primary)}
tbody td{padding:10px 12px;border-bottom:1px solid #f1f3f7;vertical-align:middle;font-size:13px}
tbody tr:hover{background:#fafbff}
tbody tr.archived td{opacity:.62}
.cell-company{font-weight:600;color:var(--text)}
.cell-link a{color:var(--primary);text-decoration:none;font-size:12px}
.cell-link a:hover{text-decoration:underline}
.cell-notes{max-width:340px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:4px}
.icon-btn{border:0;background:transparent;padding:4px 6px;border-radius:4px;color:var(--muted);font-size:14px;cursor:pointer}
.icon-btn:hover{background:#eef1f6;color:var(--text)}
.icon-btn.del:hover{background:#fdecef;color:var(--st-rejected)}

/* Status pills */
.pill{display:inline-block;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pill.saved{background:var(--st-saved)}
.pill.applied{background:var(--st-applied)}
.pill.phone-screen{background:var(--st-phone)}
.pill.interview{background:var(--st-interview)}
.pill.offer{background:var(--st-offer)}
.pill.rejected{background:var(--st-rejected)}
.pill.withdrawn{background:var(--st-withdrawn)}
.pill.archived{background:var(--st-archived);color:#5d6470}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kanban .col{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);min-height:120px}
.kanban .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kanban .col-h .count{background:#eef1f6;color:var(--muted);padding:2px 8px;border-radius:10px;font-size:11px}
.kanban .card{background:#fafbff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.kanban .card:hover{box-shadow:0 2px 8px rgba(0,115,234,.15);transform:translateY(-1px)}
.kanban .card .company{font-weight:700;font-size:13px;color:var(--text)}
.kanban .card .role{font-size:12px;color:var(--muted);margin-top:2px}
.kanban .card .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:760px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h2{margin:0;font-size:18px}
.modal-h .close{border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px}
.modal-h .close:hover{background:#eef1f6;color:var(--text)}
.modal-b{padding:18px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px}
.field input, .field select, .field textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text);font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-help{font-size:11px;color:var(--muted);margin-top:4px}

/* Welcome modal */
.welcome-hero{background:linear-gradient(135deg,#0073ea 0%,#5559df 100%);color:#fff;padding:36px 28px;text-align:center;border-radius:14px 14px 0 0}
.welcome-hero .emoji{font-size:48px;margin-bottom:8px;line-height:1}
.welcome-hero h2{margin:0 0 8px;font-size:24px}
.welcome-hero p{margin:0;opacity:.92;font-size:14px}
.welcome-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:24px}
.welcome-feature{background:#f6f7fb;border-radius:10px;padding:14px;text-align:center}
.welcome-feature .ico{font-size:24px;margin-bottom:6px}
.welcome-feature .t{font-weight:700;font-size:13px;margin-bottom:3px}
.welcome-feature .d{font-size:12px;color:var(--muted)}
.welcome-tips{padding:0 24px 18px;font-size:13px;color:var(--text);line-height:1.6}
.welcome-tips ul{padding-inline-start:18px;margin:6px 0 0}
.welcome-tips li{margin-bottom:4px}

/* Sync modal */
.sync-status{padding:14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.sync-status.local{background:#eef1f6;color:var(--muted)}
.sync-status.online{background:#dff5e7;color:#0a5d35}
.sync-section{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.sync-section h3{margin:0 0 8px;font-size:14px}
.sync-section .step{font-size:12px;color:var(--muted);margin-bottom:6px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ico{font-size:48px;margin-bottom:10px}
.empty h3{margin:0 0 4px;color:var(--text)}
.empty p{margin:0 0 14px}

/* Toast */
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:#1f2937;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#00c875}
.toast.error{background:#e2445c}

@media (max-width:640px){
  .topbar{padding:11px 14px}
  .topbar h1{font-size:16px}
  .stats{padding:12px 14px 4px;grid-template-columns:repeat(2,1fr)}
  .stat .value{font-size:20px}
  .toolbar{padding:10px 14px;gap:8px}
  .toolbar input[type=search]{min-width:140px}
  .container{padding:0 14px 60px}
  .lang-toggle button{padding:4px 8px}
}
</style>
</head>

/* ---------- State ---------- */
let DATA = [];
let UI = { view:'table', search:'', filterStatus:'all', filterArchived:'active', sortBy:'updatedAt', sortDir:'desc' };
let LANG = 'he';
let firebaseApp=null, db=null, auth=null, unsubscribe=null, syncEnabled=false, syncState='local';
let editingId = null;

/* ---------- Helpers ---------- */
const t = (key) => I18N[LANG][key] || key;
const uid = () => 'j' + Math.random().toString(36).slice(2,11) + Date.now().toString(36).slice(-4);
const escapeHtml = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(LANG==='he'?'he-IL':'en-US') : '';
const todayISO = () => new Date().toISOString().slice(0,10);

function loadState(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) DATA = JSON.parse(raw); } catch(e){ DATA = []; }
  try { const raw = localStorage.getItem(UI_KEY); if (raw) Object.assign(UI, JSON.parse(raw)); } catch(e){}
  LANG = localStorage.getItem(LANG_KEY) || 'he';
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  if (syncEnabled && db) pushToCloud();
}
function saveUI(){ localStorage.setItem(UI_KEY, JSON.stringify(UI)); }
function setLang(l){ LANG = l; localStorage.setItem(LANG_KEY, l); document.documentElement.lang = l; document.documentElement.dir = l==='he'?'rtl':'ltr'; render(); }

/* ---------- Toast ---------- */
function toast(msg, type=''){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.className = 'toast show ' + type;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.className = 'toast ' + type; }, 2400);
}

/* ---------- Filters / sort ---------- */
function applyFilters(){
  let rows = DATA.slice();
  if (UI.filterArchived === 'active') rows = rows.filter(r => r.status !== 'archived');
  else if (UI.filterArchived === 'archived') rows = rows.filter(r => r.status === 'archived');
  if (UI.filterStatus !== 'all') rows = rows.filter(r => r.status === UI.filterStatus);
  const q = (UI.search||'').trim().toLowerCase();
  if (q) rows = rows.filter(r => [r.company,r.jobTitle,r.location,r.notes].some(v => (v||'').toLowerCase().includes(q)));
  const dir = UI.sortDir === 'asc' ? 1 : -1;
  rows.sort((a,b) => {
    const av = a[UI.sortBy] || ''; const bv = b[UI.sortBy] || '';
    return av < bv ? -1*dir : av > bv ? 1*dir : 0;
  });
  return rows;
}
function getStats(){
  const active = DATA.filter(r => r.status !== 'archived');
  return {
    total: DATA.length,
    active: active.length,
    interviews: active.filter(r => r.status === 'interview' || r.status === 'phone-screen').length,
    offers: active.filter(r => r.status === 'offer').length,
    rejected: active.filter(r => r.status === 'rejected').length,
  };
}

        ${STATUSES.map(s => `<option value="${s.key}" ${UI.filterStatus===s.key?'selected':''}>${LANG==='he'?s.labelHe:s.labelEn}</option>`).join('')}

function renderEmpty(){

    <p>${t('emptyDesc')}</p>

  </div>`;
}

function renderTable(rows){
  const cols = [
    {k:'company', l:t('company')},
    {k:'jobTitle', l:t('role')},
    {k:'status', l:t('status')},
    {k:'method', l:t('method')},
    {k:'location', l:t('location')},
    {k:'appliedAt', l:t('applied')},
    {k:'updatedAt', l:t('updated')},
    {k:'notes', l:t('notes')},
  ];
  return `<div class="tablewrap"><table>
    <thead><tr>
      ${cols.map(c => `<th data-sort="${c.k}" class="${UI.sortBy===c.k?'sorted':''}">${c.l}<span class="sort-arrow">${UI.sortBy===c.k?(UI.sortDir==='asc'?'▲':'▼'):'⇅'}</span></th>`).join('')}
      <th style="cursor:default">${t('actions')}</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr class="${r.status==='archived'?'archived':''}">
        <td class="cell-company">${escapeHtml(r.company||'')}</td>
        <td>${escapeHtml(r.jobTitle||'')}${r.link?` <a href="${escapeHtml(r.link)}" target="_blank" rel="noopener" class="cell-link">↗</a>`:''}</td>
        <td><span class="pill ${r.status||'saved'}">${LANG==='he'?(STATUSES.find(s=>s.key===r.status)||{labelHe:'—'}).labelHe:(STATUSES.find(s=>s.key===r.status)||{labelEn:'—'}).labelEn}</span></td>
        <td>${LANG==='he'?(METHODS.find(m=>m.key===r.method)||{labelHe:''}).labelHe:(METHODS.find(m=>m.key===r.method)||{labelEn:''}).labelEn}</td>
        <td>${escapeHtml(r.location||'')}</td>
        <td>${fmtDate(r.appliedAt)}</td>
        <td>${fmtDate(r.updatedAt)}</td>
        <td class="cell-notes" title="${escapeHtml(r.notes||'')}">${escapeHtml(r.notes||'')}</td>
        <td><div class="row-actions">
          <button class="icon-btn edit-row" data-id="${r.id}" title="${t('edit')}">✎</button>
          <button class="icon-btn del del-row" data-id="${r.id}" title="${t('delete')}">🗑</button>
        </div></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function renderKanban(rows){
  const cols = STATUSES.filter(s => s.key !== 'archived');
  return `<div class="kanban">${cols.map(s => {
    const items = rows.filter(r => (r.status || 'saved') === s.key);
    return `<div class="col">
      <div class="col-h"><span><span class="pill ${s.key}" style="margin-inline-end:6px">${LANG==='he'?s.labelHe:s.labelEn}</span></span><span class="count">${items.length}</span></div>
      ${items.map(r => `<div class="card edit-row" data-id="${r.id}">
        <div class="company">${escapeHtml(r.company||'')}</div>
        <div class="role">${escapeHtml(r.jobTitle||'')}</div>
        <div class="meta">
          <span>${escapeHtml(r.location||'')}</span>
          <span>${fmtDate(r.appliedAt)}</span>
        </div>
      </div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}

/* ---------- Event handlers ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { UI.view = b.dataset.view; saveUI(); render(); });
  document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (UI.sortBy === k) UI.sortDir = UI.sortDir === 'asc' ? 'desc' : 'asc';
    else { UI.sortBy = k; UI.sortDir = 'desc'; }
    saveUI(); render();
  });
  const s = document.getElementById('search');
  if (s) s.oninput = (e) => {
    UI.search = e.target.value; saveUI();
    const pos = e.target.selectionStart;
    render();
    // render() rebuilds the whole DOM, so restore focus + caret on the NEW input
    const ns = document.getElementById('search');
    if (ns){ ns.focus(); try{ ns.setSelectionRange(pos,pos); }catch(_){} }
  };
  const fs = document.getElementById('filterStatus');
  if (fs) fs.onchange = (e) => { UI.filterStatus = e.target.value; saveUI(); render(); };
  const fa = document.getElementById('filterArchived');
  if (fa) fa.onchange = (e) => { UI.filterArchived = e.target.value; saveUI(); render(); };
  document.getElementById('btn-add').onclick = () => openJobModal();
  const ae = document.getElementById('btn-add-empty'); if (ae) ae.onclick = () => openJobModal();
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-import').onclick = openImportModal;
  document.getElementById('btn-settings').onclick = openSettingsModal;
  document.getElementById('sync-chip').onclick = openSyncModal;
  document.querySelectorAll('.edit-row').forEach(b => b.onclick = (e) => { e.stopPropagation(); openJobModal(b.dataset.id); });
  document.querySelectorAll('.del-row').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    if (confirm(t('confirmDelete'))) { DATA = DATA.filter(d => d.id !== b.dataset.id); saveData(); toast(t('deleted'), 'success'); render(); }
  });
}

/* ---------- Modal infrastructure ---------- */
function openModal(html){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modal-bg';
  bg.innerHTML = html;
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const closeBtn = bg.querySelector('.close, [data-close]');
  if (closeBtn) closeBtn.onclick = closeModal;
  return bg;
}
function closeModal(){ const m = document.getElementById('modal-bg'); if (m) m.remove(); }

/* ---------- Job add/edit ---------- */

  if (!r) return;
  const html = `<div class="modal">
    <div class="modal-h"><h2>${id?t('edit'):t('addJob')}</h2><button class="close">×</button></div>
    <div class="modal-b">
      <div class="field"><label>${t('company')} *</label><input id="f-company" value="${escapeHtml(r.company||'')}" autofocus></div>
      <div class="field"><label>${t('role')} *</label><input id="f-jobTitle" value="${escapeHtml(r.jobTitle||'')}"></div>
      <div class="field"><div class="row">
        <div><label>${t('status')}</label><select id="f-status">${STATUSES.map(s=>`<option value="${s.key}" ${r.status===s.key?'selected':''}>${LANG==='he'?s.labelHe:s.labelEn}</option>`).join('')}</select></div>
        <div><label>${t('method')}</label><select id="f-method">${METHODS.map(m=>`<option value="${m.key}" ${r.method===m.key?'selected':''}>${LANG==='he'?m.labelHe:m.labelEn}</option>`).join('')}</select></div>
      </div></div>
      <div class="field"><div class="row">
        <div><label>${t('location')}</label><input id="f-location" value="${escapeHtml(r.location||'')}" list="city-list"></div>
        <div><label>${t('arrangement')}</label><select id="f-arrangement">${ARRANGEMENTS.map(a=>`<option value="${a.key}" ${r.arrangement===a.key?'selected':''}>${LANG==='he'?a.labelHe:a.labelEn}</option>`).join('')}</select></div>
      </div></div>
      <div class="field"><div class="row">
        <div><label>${t('applied')}</label><input id="f-appliedAt" type="date" value="${r.appliedAt||''}"></div>
        <div><label>${t('link')}</label><input id="f-link" value="${escapeHtml(r.link||'')}" placeholder="https://..."></div>
      </div></div>
      <div class="field"><label>${t('notes')}</label><textarea id="f-notes" placeholder="${LANG==='he'?'תרשום פרטים, שמות מראיינים, רשמים…':'Notes, interviewers, impressions…'}">${escapeHtml(r.notes||'')}</textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn ghost" data-close>${t('cancel')}</button>
      <button class="btn primary" id="f-save" style="background:var(--primary);color:#fff;border-color:var(--primary)">${t('save')}</button>
    </div>
  </div>`;
  const bg = openModal(html);
  bg.querySelector('#f-save').onclick = () => {
    const company = bg.querySelector('#f-company').value.trim();
    const jobTitle = bg.querySelector('#f-jobTitle').value.trim();
    if (!company){ toast(t('requiredCompany'), 'error'); return; }
    if (!jobTitle){ toast(t('requiredRole'), 'error'); return; }
    const next = {
      id: r.id, company, jobTitle,
      status: bg.querySelector('#f-status').value,
      method: bg.querySelector('#f-method').value,
      location: bg.querySelector('#f-location').value.trim(),
      arrangement: bg.querySelector('#f-arrangement').value,
      appliedAt: bg.querySelector('#f-appliedAt').value,
      link: bg.querySelector('#f-link').value.trim(),
      notes: bg.querySelector('#f-notes').value,
      updatedAt: todayISO(),
    };
    const existing = DATA.findIndex(d => d.id === r.id);
    if (existing >= 0) DATA[existing] = { ...DATA[existing], ...next };
    else DATA.push(next);
    saveData();
    toast(id ? t('updated_toast') : t('saved'), 'success');
    closeModal(); render();
  };
}

/* ---------- Sync modal ---------- */
function openSyncModal(){
  const html = `<div class="modal">
    <div class="modal-h"><h2>${t('syncTitle')}</h2><button class="close">×</button></div>
    <div class="modal-b">
      <div class="sync-status ${syncEnabled?'online':'local'}">${syncEnabled?'✓ '+t('cloudActive'):t('localOnly')}</div>
      <p style="font-size:13px;color:var(--muted);margin:0 0 14px">${t('syncDesc')}</p>
      ${syncEnabled ? `
        <button class="btn danger" id="sync-disable">${t('disableSync')}</button>
      ` : `
        <div class="sync-section">
          <h3>${t('setupFirebase')}</h3>
          <div class="step">${t('fbStep1')} → <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a></div>
          <div class="step">${t('fbStep2')}</div>
          <div class="step">${t('fbStep3')}</div>
          <div class="step">${t('fbStep4')}</div>
          <textarea id="fb-config" placeholder="${t('firebaseConfigPlaceholder')}" style="width:100%;min-height:140px;font-family:monospace;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:6px;margin-top:10px"></textarea>
          <button class="btn primary" id="fb-enable" style="background:var(--primary);color:#fff;border-color:var(--primary);margin-top:8px">${t('enableSync')}</button>
        </div>
      `}
    </div>
    <div class="modal-f"><button class="btn ghost" data-close>${t('close')}</button></div>
  </div>`;
  const bg = openModal(html);
  if (!syncEnabled){
    bg.querySelector('#fb-enable').onclick = () => {
      const raw = bg.querySelector('#fb-config').value.trim();
      try {
        // Extract firebaseConfig object from pasted code
        let cfg;
        const m = raw.match(/\{[\s\S]*\}/);
        if (!m) throw new Error('no object');
        cfg = (new Function('return ' + m[0]))();
        if (!cfg.apiKey || !cfg.projectId) throw new Error('missing keys');
        localStorage.setItem(FB_KEY, JSON.stringify(cfg));
        initFirebase().then(()=>{ closeModal(); toast(t('cloudActive'), 'success'); render(); });
      } catch(e){ toast(t('invalidConfig'), 'error'); }
    };
  } else {
    bg.querySelector('#sync-disable').onclick = () => {
      localStorage.removeItem(FB_KEY);
      if (unsubscribe) unsubscribe();
      syncEnabled = false; syncState = 'local'; db = null; firebaseApp = null;
      closeModal(); render(); toast(LANG==='he'?'סנכרון בוטל':'Sync disabled');
    };
  }
}

/* ---------- Import / Export ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({ version:1, exportedAt: new Date().toISOString(), data: DATA }, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `jobtrack-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast(t('exported'), 'success');
}
function openImportModal(){
  const html = `<div class="modal">
    <div class="modal-h"><h2>${t('importTitle')}</h2><button class="close">×</button></div>
    <div class="modal-b">
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px">${t('importDesc')}</p>
      <input type="file" id="imp-file" accept=".json,application/json">
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" id="imp-merge">${t('importMerge')}</button>
        <button class="btn primary" id="imp-replace" style="background:var(--primary);color:#fff;border-color:var(--primary)">${t('importReplace')}</button>
      </div>
    </div>
    <div class="modal-f"><button class="btn ghost" data-close>${t('cancelImport')}</button></div>
  </div>`;
  const bg = openModal(html);
  async function doImport(mode){
    const f = bg.querySelector('#imp-file').files[0];
    if (!f){ toast(t('noFileSelected'), 'error'); return; }
    try {
      const txt = await f.text();
      const parsed = JSON.parse(txt);
      const arr = Array.isArray(parsed) ? parsed : (parsed.data || []);
      if (!Array.isArray(arr)) throw new Error('not array');
      if (mode === 'replace') DATA = arr.map(d => ({ ...d, id: d.id || uid() }));
      else { // merge
        const map = new Map(DATA.map(d => [d.id, d]));
        arr.forEach(d => { const id = d.id || uid(); map.set(id, { ...d, id }); });
        DATA = [...map.values()];
      }
      saveData(); closeModal(); render(); toast(t('imported'), 'success');
    } catch(e){ toast(t('invalidFile'), 'error'); }
  }
  bg.querySelector('#imp-replace').onclick = () => doImport('replace');
  bg.querySelector('#imp-merge').onclick = () => doImport('merge');
}

/* ---------- Firebase (optional) ---------- */
async function initFirebase(){
  const raw = localStorage.getItem(FB_KEY);
  if (!raw) return;
  try {
    const cfg = JSON.parse(raw);
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
    const fbAuth = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');
    const fbStore = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
    firebaseApp = initializeApp(cfg);
    auth = fbAuth.getAuth(firebaseApp);
    db = fbStore.getFirestore(firebaseApp);
    // Sign in anonymously so each device gets its own user namespace, but optionally hook to Google sign-in later
    await fbAuth.signInAnonymously(auth);
    fbAuth.onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const colRef = fbStore.collection(db, 'users', user.uid, 'jobs');
      unsubscribe = fbStore.onSnapshot(colRef, (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const cloud = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        if (cloud.length > 0 || DATA.length === 0){
          DATA = cloud;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
          render();
        } else {
          // first time: push local up
          pushToCloud();
        }
      }, () => { syncState = 'error'; render(); });
    });
    syncEnabled = true; syncState = 'online';
  } catch(e){ syncState = 'error'; console.error(e); }
}
async function pushToCloud(){
  if (!db || !auth || !auth.currentUser) return;
  try {
    const fbStore = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
    const uidv = auth.currentUser.uid;
    for (const r of DATA){
      await fbStore.setDoc(fbStore.doc(db, 'users', uidv, 'jobs', r.id), r);
    }
  } catch(e){ console.error('push failed', e); }
}

/* ---------- Boot ---------- */
function boot(){
  loadState();
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='he'?'rtl':'ltr';
  render();
  if (!localStorage.getItem(SEEN_KEY)) openWelcomeModal();
  if (localStorage.getItem(FB_KEY)) initFirebase().then(render);
  // Register service worker (PWA)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}
boot();
</script>
