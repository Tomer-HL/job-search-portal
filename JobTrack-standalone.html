:root {
  --bg:#eef2ee; --panel:#fbfcfb; --border:#d3dcd4; --text:#1f2a24; --muted:#566559;
  --primary:#3f6f5c; --primary-dk:#2d5445; --soft:#dcebe3; --strong:#2d5445; --hover:#e3eae4;
  --st-saved:#5c6b61; --st-applied:#3a6684; --st-phone:#3f7a78; --st-interview:#8a5a14;
  --st-offer:#2f6b45; --st-rejected:#a43d3d; --st-withdrawn:#5c6b61; --st-archived:#d3dcd4;
  --shadow-lg:0 12px 36px rgba(31,42,36,.2);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--soft)}
:root[dir=rtl] .lr-flip{transform:scaleX(-1)}

/* Top bar */
.topbar{padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.brand{margin:0;display:flex;align-items:center;gap:12px;font-family:"Alef","Assistant",serif;font-size:24px;font-weight:700}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:"Assistant",sans-serif;font-size:14px;font-weight:700}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:600;font-size:14px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dk)}
.btn.danger{background:#a43d3d;border-color:#a43d3d;color:#fff}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.success{background:#2f6b45;border-color:#2f6b45;color:#fff}
.btn.small{padding:6px 12px;font-size:13px;min-height:34px}
button.sync-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;min-height:34px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-size:13px;color:var(--text)}
button.sync-chip:hover{background:var(--hover)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#76837a;display:inline-block}
.sync-dot.online{background:#3f8a5f}
.sync-dot.offline{background:#a06d15}
.sync-dot.error{background:#b84a4a}
.lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel);font-size:13px;font-weight:700}
.lang-toggle button{border:0;background:transparent;color:var(--muted);padding:7px 12px}
.lang-toggle button.active{background:var(--soft);color:var(--strong)}

/* View bar */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 28px 0}
.summary{font-size:15px;color:var(--muted)}
.view-toggle{display:inline-flex;gap:22px}
.view-toggle button{border:0;border-bottom:3px solid transparent;background:transparent;padding:6px 0 8px;font-size:16px;color:var(--muted)}
.view-toggle button.active{color:var(--text);font-weight:700;border-bottom-color:var(--primary)}

/* Today split view */
.split{display:grid;grid-template-columns:minmax(320px,430px) 1fr;align-items:start;margin-top:10px}
.list-pane{padding:12px 24px 48px;border-inline-end:1px solid var(--border);min-height:calc(100vh - 150px)}
.detail-pane{padding:28px 52px 64px;max-width:900px}
.list-search input{width:100%;height:42px;border:1px solid #738378;background:var(--panel);border-radius:8px;padding:0 14px;font:inherit;font-size:15px;color:var(--text)}
.grp{margin-top:20px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 6px}
.grp-title{margin:0;font-family:"Alef","Assistant",serif;font-size:19px;font-weight:700}
.grp-count{font-size:14px;color:var(--muted)}
.li{width:100%;min-height:58px;padding:8px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;text-align:start;font:inherit;color:inherit}
.li:hover{background:var(--hover)}
.li[aria-current=true]{background:var(--panel);box-shadow:0 0 0 1px var(--border)}
.li .co{display:block;font-weight:700;font-size:16px}
.li .sub{display:block;font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:700;color:var(--strong);background:var(--soft);padding:3px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.tag.late{background:#f3dede;color:#7a2b2b}
.tag.quiet{background:transparent;color:var(--muted);font-weight:400;padding:0}
.linklike.more-btn{margin:6px 14px 0;font-size:14px}
.none-line{margin:8px 4px;color:var(--muted);font-size:15px}

.d-kicker{font-size:16px;color:var(--muted)}
.d-title{font-family:"Alef","Assistant",serif;font-size:40px;font-weight:700;line-height:1.15;margin:2px 0 8px;overflow-wrap:anywhere}
.d-meta{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.steps{display:flex;gap:8px;margin:24px 0}
.steps .s{flex:1}
.steps .bar{height:6px;border-radius:3px;background:var(--border)}
.steps .on .bar{background:var(--primary)}
.steps .lbl{font-size:14px;margin-top:6px;color:var(--muted)}
.steps .on .lbl{color:var(--text);font-weight:700}
.next{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.next .k{font-size:14px;font-weight:700;color:var(--strong)}
.next .v{font-size:18px;margin-top:4px}
.next .v.muted{color:var(--muted)}
.d-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;margin-top:26px}
.d-h{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.ev{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--border);font-size:16px}
.ev .d{width:52px;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums}
.d-notes{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.back-btn{display:none;margin-bottom:12px}

/* Browse views (table / kanban) */
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 28px;flex-wrap:wrap}
.toolbar input[type=search],.toolbar select{padding:9px 12px;border:1px solid #738378;border-radius:8px;font:inherit;font-size:15px;background:var(--panel);color:var(--text)}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:400px}
.spacer{flex:1}
.container{padding:0 28px 60px}
.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:var(--panel);text-align:start;font-size:13px;color:var(--muted);font-weight:700;padding:12px;border-bottom:1px solid var(--border);position:sticky;top:0}
thead th .sort-arrow{opacity:.5;margin-inline-start:4px;font-size:10px}
thead th.sorted .sort-arrow{opacity:1;color:var(--primary)}
tbody td{padding:11px 12px;border-bottom:1px solid #e6ece7;vertical-align:middle;font-size:15px}
tbody tr:hover{background:#f3f7f4}
tbody tr.archived td{opacity:.8}
.cell-company{font-weight:700}
.cell-link a{color:#245a46;text-decoration:none;font-size:14px}
.cell-link a:hover{text-decoration:underline}
.cell-notes{max-width:300px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:4px}
.icon-btn{border:0;background:transparent;padding:4px 8px;border-radius:6px;color:var(--muted);font-size:14px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.del:hover{background:#f3dede;color:#7a2b2b}
.th-btn{background:none;border:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}

/* Status pills */
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.pill.saved{background:var(--st-saved)}
.pill.applied{background:var(--st-applied)}
.pill.phone-screen{background:var(--st-phone)}
.pill.interview{background:var(--st-interview)}
.pill.offer{background:var(--st-offer)}
.pill.rejected{background:var(--st-rejected)}
.pill.withdrawn{background:var(--st-withdrawn)}
.pill.archived{background:var(--st-archived);color:var(--text)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kanban .col{background:#e5ece6;border-radius:12px;padding:12px;min-height:120px}
.kanban .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:14px}
.kanban .col-h .count{background:var(--panel);color:var(--muted);padding:2px 9px;border-radius:10px;font-size:13px}
.kanban .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.kanban .card:hover{background:#fff;border-color:#b9c7bc}
.kanban .card .company{font-weight:700;font-size:16px}
.kanban .card .role{font-size:14px;color:var(--muted);margin-top:2px}
.kanban .card .meta{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(24,34,28,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:760px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h2{margin:0;font-family:"Alef","Assistant",serif;font-size:21px}
.modal-h .close{border:0;background:transparent;font-size:22px;color:var(--muted);width:36px;height:36px;border-radius:6px}
.modal-h .close:hover{background:var(--hover);color:var(--text)}
.modal-b{padding:18px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid #738378;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--text)}
.field textarea{min-height:76px;resize:vertical}
.field .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-help{font-size:13px;color:var(--muted);margin-top:4px}
details.more{margin:6px 0 2px;border:1px solid var(--border);border-radius:8px;padding:2px 12px}
details.more>summary{cursor:pointer;font-weight:600;padding:10px 0}
details.more .field{margin-top:8px}

/* Welcome */
.welcome-hero{background:var(--soft);color:var(--text);padding:34px 28px;text-align:center;border-radius:14px 14px 0 0}
.welcome-hero .emoji{display:none}
.welcome-hero h2{margin:0 0 8px;font-family:"Alef","Assistant",serif;font-size:26px}
.welcome-hero p{margin:0;font-size:16px;color:var(--strong)}
.welcome-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:22px}
.welcome-feature{background:var(--bg);border-radius:10px;padding:14px}
.welcome-feature .ico{display:none}
.welcome-feature .t{font-weight:700;font-size:15px;margin-bottom:3px}
.welcome-feature .d{font-size:14px;color:var(--muted)}
.welcome-tips{padding:0 24px 18px;font-size:15px;line-height:1.6}
.welcome-tips ul{padding-inline-start:18px;margin:6px 0 0}
.welcome-tips li{margin-bottom:4px}

/* Sync modal */
.sync-status{padding:14px;border-radius:8px;margin-bottom:14px;font-size:15px}
.sync-status.local{background:var(--bg);color:var(--muted)}
.sync-status.online{background:var(--soft);color:var(--strong)}
.sync-section{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.sync-section h3{margin:0 0 8px;font-size:16px}
.sync-section .step{font-size:14px;color:var(--muted);margin-bottom:6px}

/* Empty / toast */
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .ico{display:none}
.empty h2,.empty h3{margin:0 0 6px;color:var(--text);font-family:"Alef","Assistant",serif;font-size:24px}
.empty p{margin:0 0 16px}
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:#1f2a24;color:#fff;padding:12px 18px;border-radius:8px;font-size:15px;box-shadow:var(--shadow-lg);z-index:200;transform:translateY(100px);opacity:0;transition:.25s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#2d5445}
.toast.error{background:#8c3030}

/* Accessibility & utilities */
.skip-link{position:absolute;inset-inline-start:8px;top:-60px;background:#fff;color:#1f2a24;padding:10px 16px;border-radius:8px;font-weight:700;z-index:400;text-decoration:none;box-shadow:var(--shadow-lg)}
.skip-link:focus{top:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #1f2a24;outline-offset:2px;box-shadow:0 0 0 5px #fff}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
main:focus{outline:none}
.mobile-only{display:none}
.app-footer{padding:22px 28px 40px;font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.app-footer a,.linklike{color:#245a46;background:none;border:0;padding:6px 2px;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.legal h3{font-size:16px;margin:16px 0 4px}
.legal p,.legal li{font-size:15px;line-height:1.65;margin:4px 0}
.legal ul{margin:4px 0;padding-inline-start:20px}
.legal .upd{font-size:13px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;margin:12px 0}
.consent input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.btn.google{background:#fff;color:#1f2937;border:1px solid #747775;font-size:15px;padding:10px 16px}
.btn.google:disabled{opacity:.55;cursor:not-allowed}
.acct{display:flex;gap:10px;align-items:center;margin:8px 0 14px;font-size:15px}
.acct b{display:block}

/* Theme: deep sea-green (default) or the light sage page; the dark chrome rules apply unless data-theme="light" */
:root{--page:#17383a;--on-page:#eaf4ef;--on-page-2:#b9d3c9;--page-line:#2f5a5a;--accent:#9fd3b8}
html,body{background:var(--page)}
:root[data-theme="light"]{--page:#eef2ee}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:0 10px}
.theme-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root:not([data-theme="light"]) .topbar{border-bottom-color:var(--page-line)}
:root:not([data-theme="light"]) .brand{color:var(--on-page)}
:root:not([data-theme="light"]) .brand .mark{background:var(--accent);color:#12302f}
:root:not([data-theme="light"]) .topbar .btn.ghost{color:var(--on-page);border-color:#648f88}
:root:not([data-theme="light"]) .topbar .btn.ghost:hover{background:rgba(255,255,255,.1)}
:root:not([data-theme="light"]) .topbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#12302f}
:root:not([data-theme="light"]) .topbar .btn.primary:hover{background:#b9e3cf}
:root:not([data-theme="light"]) .summary{color:var(--on-page-2)}
:root:not([data-theme="light"]) .view-toggle button{color:var(--on-page-2)}
:root:not([data-theme="light"]) .view-toggle button.active{color:#fff;border-bottom-color:var(--accent)}
:root:not([data-theme="light"]) .split{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:12px 28px 0;overflow:hidden}
:root:not([data-theme="light"]) .app-footer{color:var(--on-page-2)}
:root:not([data-theme="light"]) .app-footer a,:root:not([data-theme="light"]) .app-footer .linklike{color:var(--accent)}
:root:not([data-theme="light"]) .container .empty{color:var(--on-page-2)}
:root:not([data-theme="light"]) .container .empty h2,:root:not([data-theme="light"]) .container .empty h3{color:var(--on-page)}
:root:not([data-theme="light"]) .tablewrap .empty{color:var(--muted)}
:root:not([data-theme="light"]) .tablewrap .empty h2,:root:not([data-theme="light"]) .tablewrap .empty h3{color:var(--text)}
@media (max-width:860px){.split{margin-inline:14px}}
@media (max-width:860px){
  .split{grid-template-columns:1fr;margin-top:0}
  .split[data-pane=list] .detail-pane{display:none}
  .split[data-pane=detail] .list-pane{display:none}
  .back-btn{display:inline-flex}
  .list-pane{border:0;padding:12px 14px 40px;min-height:0}
  .detail-pane{padding:18px 18px 50px}
  .d-title{font-size:32px}
  .d-grid{grid-template-columns:1fr;gap:24px}
  .viewbar{padding:12px 14px 0}
}
@media (pointer:coarse),(max-width:640px){
  .btn,.icon-btn,.lang-toggle button,.view-toggle button,button.sync-chip,.th-btn,.li{min-height:44px}
  .icon-btn{min-width:44px;font-size:16px}
  .lang-toggle button{min-width:44px}
  .toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea,.list-search input{min-height:44px;font-size:16px}
}
@media (max-width:640px){
  .hide-mobile{display:none!important}
  .mobile-only{display:inline-block}
  .topbar{padding:12px 14px}
  .brand{font-size:21px}
  .toolbar{padding:12px 14px;gap:8px}
  .toolbar .spacer{display:none}
  .toolbar select,.toolbar input[type=search]{flex:1 1 100%;max-width:none}
  .container{padding:0 14px 40px}
  .app-footer{padding:18px 14px 40px}
  .view-toggle{gap:16px}
  .tablewrap{border:0;background:transparent;overflow:visible}
  table{min-width:0;display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  tbody{display:block}
  tbody tr{display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:0 0 10px;padding:8px 12px}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border:0;white-space:normal;max-width:none;text-align:end}
  tbody td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:start;flex:0 0 36%}
  tbody td[data-label=""]::before{display:none}
  tbody td.cell-company{font-size:17px;text-align:start}
  tbody td.cell-company::before{display:none}
  .cell-notes{white-space:normal;overflow:visible;text-overflow:clip}
  .row-actions{margin-inline-start:auto}
  .kanban{grid-template-columns:1fr}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-width:none;max-height:94vh;border-radius:16px 16px 0 0}
  .field .row{grid-template-columns:1fr}
  .toast{inset-inline:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.pill,.tag{border:1px solid CanvasText}}
</style>

const t = (key) => I18N[LANG][key] || key;
const uid = () => 'j' + Math.random().toString(36).slice(2,11) + Date.now().toString(36).slice(-4);
const escapeHtml = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(LANG==='he'?'he-IL':'en-US') : '';
const localISO = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => localISO();
const addDays = (iso, n) => { const p = iso.split('-').map(Number); return localISO(new Date(p[0], p[1]-1, p[2]+n)); };
const daysBetween = (a, b) => { const p = x => { const q = x.split('-').map(Number); return Date.UTC(q[0], q[1]-1, q[2]); }; return Math.round((p(b) - p(a)) / 86400000); };
const isoDay = (v) => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(v || ''); return m ? m[1] : ''; };
const isArchived = (r) => r.archived === true || r.status === 'archived';
const EXTRA_FIELDS = ['connection','interviewer','interviewRound','nextInterview','prepNotes','resumeVersion','coverLetter','portfolio','salary'];
function normalizeRecord(r){
  const o = { ...r };
  if (!o.id) o.id = uid();
  o.id = String(o.id).replace(/[\/\s]+/g, '_');
  if (!o.appliedAt && o.dateApplied) o.appliedAt = o.dateApplied;
  return o;
}
function toCloud(r){ const o = { ...r }; if (o.appliedAt) o.dateApplied = o.appliedAt; return JSON.parse(JSON.stringify(o)); }
function sigOf(r){ const o = toCloud(r); return JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]])); }
function announce(msg){ const l = document.getElementById('live'); if (l){ l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 60); } }


function loadState(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) DATA = JSON.parse(raw).map(normalizeRecord); } catch(e){ DATA = []; }
  try { const raw = localStorage.getItem(UI_KEY); if (raw) Object.assign(UI, JSON.parse(raw)); } catch(e){}
  if (!UI.v2){ UI.view = 'today'; UI.v2 = 1; saveUI(); }  // one-time: new default landing view
  LANG = localStorage.getItem(LANG_KEY) || 'he';
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  if (syncEnabled) uploadDiff();
}
function saveUI(){ localStorage.setItem(UI_KEY, JSON.stringify(UI)); }
const THEME_KEY='jobtrack-community-theme-v1';
let THEME='dark'; try{ if(localStorage.getItem(THEME_KEY)==='light') THEME='light'; }catch(e){}
function applyTheme(){ if(THEME==='light') document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme');
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', THEME==='light'?'#eef2ee':'#17383a'); }

/* ---------- Toast ---------- */
function toast(msg, type=''){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
  el.textContent = msg; announce(msg); el.className = 'toast show ' + type;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.className = 'toast ' + type; }, 2400);
}

/* ---------- Filters / sort ---------- */
function applyFilters(){
  let rows = DATA.slice();
  if (UI.filterArchived === 'active') rows = rows.filter(r => !isArchived(r));
  else if (UI.filterArchived === 'archived') rows = rows.filter(r => isArchived(r));
  if (UI.filterStatus !== 'all') rows = rows.filter(r => r.status === UI.filterStatus);
  const q = (UI.search||'').trim().toLowerCase();
  if (q) rows = rows.filter(r => [r.company,r.jobTitle,r.location,r.notes,r.connection].some(v => (v||'').toLowerCase().includes(q)));
  const dir = UI.sortDir === 'asc' ? 1 : -1;
  rows.sort((a,b) => {
    const av = a[UI.sortBy] || ''; const bv = b[UI.sortBy] || '';
    return av < bv ? -1*dir : av > bv ? 1*dir : 0;
  });
  return rows;
}
function getStats(){
  const active = DATA.filter(r => !isArchived(r));
  return {
    total: DATA.length,
    active: active.length,
    interviews: active.filter(r => r.status === 'interview' || r.status === 'phone-screen').length,
    offers: active.filter(r => r.status === 'offer').length,
    rejected: active.filter(r => r.status === 'rejected').length,
  };
}

/* ---------- Due / follow-up logic ---------- */
function dueInfo(r){
  if (isArchived(r) || ['rejected','withdrawn','saved'].includes(r.status)) return null;
  const today = todayISO();
  const na = isoDay(r.nextActionAt);
  if (na) return { date:na, kind:'next', text: r.nextAction || t('nextStep') };
  const ni = isoDay(r.nextInterview);
  if ((r.status === 'interview' || r.status === 'phone-screen') && ni && ni >= addDays(today, -1)){
    const tm = /T(\d{2}:\d{2})/.exec(r.nextInterview || '');
    return { date:ni, kind:'interview', text: t('interviewText') + (tm ? ' · ' + tm[1] : '') };
  }
  const last = isoDay(r.lastFollowUpAt);
  if (r.status === 'offer') return { date: last ? addDays(last, 7) : today, kind:'offer', text:t('offerText') };
  const base = [isoDay(r.appliedAt), isoDay(r.updatedAt), last].filter(Boolean).sort().pop();
  if (!base) return null;
  const age = daysBetween(base, today);
  if (age > 21) return null;
  return { date: addDays(base, 7), kind:'followup', derived:true, age, text:t('followupText') };
}
function relDay(date){
  const n = daysBetween(todayISO(), date);
  if (n === 0) return t('dToday');
  if (n === 1) return t('dTomorrow');
  if (n === -1) return t('dYesterday');
  return (n > 1 ? t('dIn') : t('dAgo')).replace('{n}', Math.abs(n));
}
function todayGroups(rows){
  const today = todayISO(), weekEnd = addDays(today, 7);
  const g = { today:[], week:[], suggested:[], wait:[], saved:[] };
  rows.forEach(r => {
    const due = dueInfo(r);
    const it = { r, due };
    if (r.status === 'saved') g.saved.push(it);
    else if (!due) g.wait.push(it);
    else if (due.derived) (due.date <= today ? g.suggested : g.wait).push(it);
    else if (due.date <= today) g.today.push(it);
    else if (due.date <= weekEnd) g.week.push(it);
    else g.wait.push(it);
  });
  const byDate = (a, b) => a.due.date < b.due.date ? -1 : a.due.date > b.due.date ? 1 : 0;
  g.today.sort(byDate); g.week.sort(byDate);
  g.suggested.sort((a, b) => b.due.age - a.due.age);
  g.wait.sort((a, b) => (b.r.updatedAt || '') < (a.r.updatedAt || '') ? -1 : 1);
  return g;
}
function markDone(id){
  const r = DATA.find(d => d.id === id); if (!r) return;
  const due = dueInfo(r); if (!due) return;
  const today = todayISO(), log = (r.log || []).slice(-29);
  if (due.kind === 'next'){ log.push({ d:today, t:t('evDone') + (r.nextAction ? ': ' + r.nextAction : '') }); r.nextAction = ''; r.nextActionAt = ''; }
  else if (due.kind === 'interview'){ log.push({ d:today, t:t('evInterviewDone') }); r.nextInterview = ''; }
  else { log.push({ d:today, t:t('evFollowup') }); r.lastFollowUpAt = today; }
  r.log = log; r.updatedAt = today;
  saveData(); toast(t('done'), 'success'); render();
}
function deleteJob(id){
  if (!confirm(t('confirmDelete'))) return;
  DATA = DATA.filter(d => d.id !== id); saveData(); UI.pane = 'list'; saveUI(); toast(t('deleted'), 'success'); render();
}

  if (syncEnabled && syncState === 'error') return { cls:'error', text:t('syncErrorLabel') };
  if (syncEnabled && !navigator.onLine) return { cls:'offline', text:t('offlineLabel') };
  if (syncEnabled) return { cls:'online', text:t('syncedLabel') };
  return { cls:'', text:t('signInSync') };
}

function tagFor(it){
  if (it.due && it.due.derived) return t('noReply').replace('{n}', it.due.age);
  if (it.due) return relDay(it.due.date);
  return statusLabel(it.r.status);
}
function listItem(it, sel){
  const late = it.due && !it.due.derived && it.due.date < todayISO();
  const cls = it.due ? (late ? 'tag late' : 'tag') : 'tag quiet';
  return `<button type="button" class="li" data-sel="${escapeHtml(it.r.id)}" aria-current="${!!(sel && sel.id === it.r.id)}">
    <span><span class="co">${escapeHtml(it.r.company||'')}</span><span class="sub">${escapeHtml(it.r.jobTitle||'')}</span></span>
    <span class="${cls}">${escapeHtml(tagFor(it))}</span></button>`;
}
function groupHtml(title, items, sel, extra){
  if (!items.length) return '';
  return `<section class="grp"><div class="grp-h"><h2 class="grp-title">${title}</h2><span class="grp-count">${items.length}</span></div>${items.map(i => listItem(i, sel)).join('')}${extra || ''}</section>`;
}
function renderToday(){
  if (DATA.length === 0) return `<main class="container" id="main" tabindex="-1">${renderEmpty()}</main>`;
  const q = (UI.search || '').trim().toLowerCase();
  let rows = DATA.filter(r => !isArchived(r) && r.status !== 'rejected' && r.status !== 'withdrawn');
  if (q) rows = rows.filter(r => [r.company, r.jobTitle, r.location, r.notes, r.connection].some(v => (v || '').toLowerCase().includes(q)));
  const g = todayGroups(rows);
  const all = [...g.today, ...g.week, ...g.suggested, ...g.wait, ...g.saved];
  const sel = DATA.find(r => r.id === UI.sel && !isArchived(r)) || (all[0] && all[0].r) || null;
  const CAP = 5;
  const showAll = UI.moreWeek || g.suggested.length <= CAP + 1;
  const sugg = showAll ? g.suggested : g.suggested.slice(0, CAP);
  const moreBtn = g.suggested.length > CAP + 1
    ? `<button type="button" class="linklike more-btn" data-act="more">${showAll ? t('showLess') : t('showMore').replace('{n}', g.suggested.length - CAP)}</button>` : '';
  return `<main id="main" tabindex="-1"><div class="split" data-pane="${UI.pane === 'detail' ? 'detail' : 'list'}">
    <div class="list-pane">
      <div class="list-search"><input type="search" id="search" placeholder="${t('search')}" aria-label="${t('search')}" autocomplete="off" value="${escapeHtml(UI.search)}"></div>
      ${g.today.length ? '' : `<p class="none-line">${t('nothingToday')}</p>`}
      ${groupHtml(t('groupToday'), g.today, sel)}
      ${groupHtml(t('groupWeek'), g.week, sel)}
      ${groupHtml(t('suggested'), sugg, sel, moreBtn)}
      ${groupHtml(t('groupWaiting'), g.wait, sel)}
      ${groupHtml(t('groupSaved'), g.saved, sel)}
      ${all.length ? '' : `<p class="none-line">${t('noResultsShort')}</p>`}
    </div>
    <section class="detail-pane" aria-label="${t('detailLabel')}">${sel ? renderDetail(sel) : `<p class="none-line">${t('pickJob')}</p>`}</section>
  </div></main>`;
}
function fmtDM(d){ const s = isoDay(d); return s ? s.slice(8, 10) + '.' + s.slice(5, 7) : ''; }
function renderDetail(r){
  const due = dueInfo(r), id = escapeHtml(r.id);
  const arr = ARRANGEMENTS.find(a => a.key === r.arrangement);
  const meta = [r.location, arr ? (LANG==='he' ? arr.labelHe : arr.labelEn) : '', r.appliedAt ? t('applied') + ' ' + fmtDate(r.appliedAt) : '', methodLabel(r.method)].filter(Boolean).map(escapeHtml);
  const stages = ['applied', 'phone-screen', 'interview', 'offer'];
  const idx = stages.indexOf(r.status);
  const steps = stages.map((k, i) => `<div class="s ${i <= idx ? 'on' : ''}"><div class="bar"></div><div class="lbl">${statusLabel(k)}</div></div>`).join('');
  const ev = [...(r.log || []).map(e => ({ d:isoDay(e.d), t:e.t }))];
  if (r.appliedAt) ev.push({ d:isoDay(r.appliedAt), t:t('evApplied') });
  ev.sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
  const nextBox = due
    ? `<div class="next"><div><div class="k">${due.derived ? t('suggested') + ' · ' + t('noReply').replace('{n}', due.age) : t('nextStep') + ' · ' + relDay(due.date)}</div><div class="v">${escapeHtml(due.text)}</div></div><button type="button" class="btn primary" data-act="done" data-id="${id}">${t('markDone')}</button></div>`
    : `<div class="next"><div><div class="k">${t('nextStep')}</div><div class="v muted">${t('noNextStep')}</div></div><button type="button" class="btn" data-act="addnext" data-id="${id}">${t('addNextStep')}</button></div>`;
  return `<button type="button" class="btn ghost small back-btn" data-act="back">← ${t('backToList')}</button>
    <div class="d-kicker">${escapeHtml(r.jobTitle || '')}</div>
    <h2 class="d-title">${escapeHtml(r.company || '')}</h2>
    <div class="d-meta"><span class="pill ${r.status || 'saved'}">${statusLabel(r.status)}</span>${meta.map(m => `<span>${m}</span>`).join('')}</div>
    <div class="d-actions">
      <button type="button" class="btn small" data-act="edit" data-id="${id}">${t('edit')}</button>
      ${r.link ? `<a class="btn small" href="${escapeHtml(r.link)}" target="_blank" rel="noopener">${t('openLink')}<span class="sr-only"> (${t('newTab')})</span></a>` : ''}
      <button type="button" class="btn ghost small" data-act="del" data-id="${id}">${t('delete')}</button>
    </div>
    <div class="steps" aria-label="${t('status')}">${steps}</div>
    ${nextBox}
    <div class="d-grid">
      <div><h3 class="d-h">${t('history')}</h3>${ev.slice(0, 8).map(e => `<div class="ev"><div class="d">${fmtDM(e.d)}</div><div>${escapeHtml(e.t)}</div></div>`).join('')}</div>
      <div><h3 class="d-h">${t('notes')}</h3><div class="d-notes">${escapeHtml(r.notes || '') || '<span class="none-line">—</span>'}</div></div>
    </div>`;
}

/* ---------- Event handlers ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  const tb=document.getElementById('btn-theme'); if(tb) tb.onclick = toggleTheme;
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { UI.view = b.dataset.view; UI.pane = 'list'; saveUI(); render(); });
  document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (UI.sortBy === k) UI.sortDir = UI.sortDir === 'asc' ? 'desc' : 'asc';
    else { UI.sortBy = k; UI.sortDir = 'desc'; }
    saveUI(); render();
  });
  document.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { UI.sel = b.dataset.sel; UI.pane = 'detail'; saveUI(); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act, id = b.dataset.id;
    if (a === 'back'){ UI.pane = 'list'; saveUI(); render(); }
    else if (a === 'done') markDone(id);
    else if (a === 'addnext') openJobModal(id, true);
    else if (a === 'edit') openJobModal(id);
    else if (a === 'del') deleteJob(id);
    else if (a === 'more'){ UI.moreWeek = !UI.moreWeek; saveUI(); render(); }
  });

/* ---------- Modal infrastructure ---------- */
let lastFocus = null;
function openModal(html){
  const had = document.getElementById('modal-bg');
  closeModal(true);
  if (!had) lastFocus = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modal-bg';
  bg.innerHTML = html;
  const dlg = bg.querySelector('.modal');
  if (dlg){
    dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
    const h = dlg.querySelector('h2');
    if (h){ h.id = 'modal-title'; dlg.setAttribute('aria-labelledby', 'modal-title'); }
  }
  // associate labels with their controls (programmatic labels for screen readers)
  bg.querySelectorAll('label').forEach(l => {
    if (l.htmlFor || l.querySelector('input,select,textarea')) return;
    const n = l.nextElementSibling;
    if (n && /^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName) && n.id) l.htmlFor = n.id;
  });
  bg.querySelectorAll('.close').forEach(b => b.setAttribute('aria-label', t('close')));
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  bg.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.stopPropagation(); closeModal(); return; }
    if (e.key === 'Tab'){
      const f = [...bg.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,summary')].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  document.body.appendChild(bg);
  bg.querySelectorAll('.close,[data-close]').forEach(b => { b.onclick = () => closeModal(); });
  const first = bg.querySelector('input:not([type=checkbox]):not([type=file]),textarea') || bg.querySelector('button');
  if (first) first.focus();
  return bg;
}
function closeModal(silent){
  const m = document.getElementById('modal-bg');
  if (!m) return;
  m.remove();
  if (silent !== true && lastFocus && document.contains(lastFocus)){ try { lastFocus.focus(); } catch(_){} }
}

/* ---------- Cloud sync (Google sign-in + Firestore) ---------- */
function loadFirebase(){
  if (fbReady) return fbReady;
  fbReady = (async () => {
    const [appM, authM, fsM] = await Promise.all([
      import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')
    ]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    let db;
    try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch(e){ db = fsM.getFirestore(app); }
    fb = { app, auth, db, fa: authM, fs: fsM };
    authM.onAuthStateChanged(auth, onAuthChanged);
    return fb;
  })().catch(e => { fbReady = null; throw e; });
  return fbReady;
}
async function startSync(){
  try {
    syncState = 'connecting'; render();
    await loadFirebase();
    fb.fa.getRedirectResult(fb.auth).catch(e => { toast(authErrorText(e), 'error'); });
  } catch(e){
    console.error(e);
    syncEnabled = false; syncState = navigator.onLine ? 'error' : 'local'; render();
  }
}
function authErrorText(e){
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return t('errDomain');
  if (c === 'auth/network-request-failed') return t('errNetwork');
  if (c === 'auth/popup-blocked') return t('errPopup');
  return t('errAuth');
}
async function signInWithGoogle(){
  syncState = 'connecting'; render();
  try {
    await loadFirebase();
    const provider = new fb.fa.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    localStorage.setItem(SYNC_KEY, '1');
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
    if (standalone){ await fb.fa.signInWithRedirect(fb.auth, provider); return; }
    try { await fb.fa.signInWithPopup(fb.auth, provider); }
    catch(e){
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){ await fb.fa.signInWithRedirect(fb.auth, provider); return; }
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'){
        if (!currentUser){ localStorage.removeItem(SYNC_KEY); syncState = 'local'; } else { syncState = 'online'; }
        render(); return;
      }
      throw e;
    }
  } catch(e){
    console.error(e); localStorage.removeItem(SYNC_KEY);
    syncEnabled = false; syncState = 'local'; render(); toast(authErrorText(e), 'error');
  }
}
function onAuthChanged(user){
  currentUser = user;
  if (unsubscribe){ unsubscribe(); unsubscribe = null; }
  cloudShadow = new Map();
  if (!user){ syncEnabled = false; syncState = 'local'; render(); return; }
  const prev = localStorage.getItem(UID_KEY);
  if (prev && prev !== user.uid){ // a different account used this device: never mix their data
    DATA = []; localStorage.setItem(STORAGE_KEY, '[]'); localStorage.removeItem(SYNCED_KEY);
  }
  localStorage.setItem(UID_KEY, user.uid);
  localStorage.setItem(SYNC_KEY, '1');
  syncEnabled = true; syncState = 'connecting'; render();
  const { collection, onSnapshot } = fb.fs;
  unsubscribe = onSnapshot(collection(fb.db, 'users', user.uid, CLOUD_COLLECTION), handleSnapshot, (err) => {
    console.error(err); syncState = 'error'; render();
    toast(err && err.code === 'permission-denied' ? t('rulesDenied') : t('syncErrorLabel'), 'error');
  });
}
function loadSynced(){ try { return new Set(JSON.parse(localStorage.getItem(SYNCED_KEY) || '[]')); } catch(e){ return new Set(); } }
function handleSnapshot(snap){
  const cloud = snap.docs.map(d => normalizeRecord({ ...d.data(), id: d.id }));
  const cloudIds = new Set(cloud.map(r => r.id));
  const trusted = !snap.metadata.fromCache;       // server-confirmed view: a record missing from it was deleted elsewhere
  const synced = loadSynced();
  // keep local records the cloud has never seen (first sign-in / offline-created); drop ones deleted on another device
  const localKeep = DATA.filter(r => !cloudIds.has(r.id) && (!trusted || !synced.has(r.id)));
  DATA = cloud.concat(localKeep);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  cloudShadow = new Map(cloud.map(r => [r.id, sigOf(r)]));
  if (trusted) localStorage.setItem(SYNCED_KEY, JSON.stringify([...cloudIds]));
  syncState = 'online'; render();
  if (trusted) uploadDiff();
}
function onWriteError(e){
  console.error(e); syncState = 'error'; render();
  toast(e && e.code === 'permission-denied' ? t('rulesDenied') : t('syncErrorLabel'), 'error');
}
function uploadDiff(){
  if (!fb || !currentUser || !syncEnabled) return;
  const { doc, setDoc, deleteDoc } = fb.fs, u = currentUser.uid;
  const ids = new Set();
  DATA.forEach(r => {
    ids.add(r.id);
    const sg = sigOf(r);
    if (cloudShadow.get(r.id) !== sg){
      cloudShadow.set(r.id, sg);
      try { setDoc(doc(fb.db, 'users', u, CLOUD_COLLECTION, r.id), toCloud(r)).catch(onWriteError); } catch(e){ onWriteError(e); }
    }
  });
  [...cloudShadow.keys()].forEach(id => {
    if (!ids.has(id)){
      cloudShadow.delete(id);
      try { deleteDoc(doc(fb.db, 'users', u, CLOUD_COLLECTION, id)).catch(onWriteError); } catch(e){ onWriteError(e); }
    }
  });
}
function resetLocalAccountState(){
  DATA = []; localStorage.setItem(STORAGE_KEY, '[]');
  [SYNC_KEY, SYNCED_KEY, UID_KEY].forEach(k => localStorage.removeItem(k));
  syncEnabled = false; syncState = 'local'; currentUser = null; cloudShadow = new Map();
}
async function signOutUser(){
  if (!confirm(t('signOutConfirm'))) return;
  try { if (unsubscribe){ unsubscribe(); unsubscribe = null; } await fb.fa.signOut(fb.auth); } catch(e){ console.error(e); }
  resetLocalAccountState(); closeModal(true); render(); toast(t('signedOut'), 'success');
}
async function deleteMyData(){
  if (!fb || !currentUser) return;
  if (!confirm(t('deleteConfirm'))) return;
  const user = currentUser;
  try {
    if (unsubscribe){ unsubscribe(); unsubscribe = null; }
    const { collection, getDocs, writeBatch } = fb.fs;
    const snap = await getDocs(collection(fb.db, 'users', user.uid, CLOUD_COLLECTION));
    let batch = writeBatch(fb.db), n = 0;
    for (const d of snap.docs){ batch.delete(d.ref); if (++n % 400 === 0){ await batch.commit(); batch = writeBatch(fb.db); } }
    await batch.commit();
    try { await fb.fa.deleteUser(user); }
    catch(e){
      if (e.code === 'auth/requires-recent-login'){ await fb.fa.reauthenticateWithPopup(user, new fb.fa.GoogleAuthProvider()); await fb.fa.deleteUser(user); }
      else throw e;
    }
    resetLocalAccountState(); closeModal(true); render(); toast(t('deletedAll'), 'success');
  } catch(e){
    console.error(e); toast(authErrorText(e), 'error');
    if (fb.auth.currentUser) onAuthChanged(fb.auth.currentUser);   // resume syncing if the account still exists
  }
}

/* ---------- Boot ---------- */
function boot(){
  loadState();
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='he'?'rtl':'ltr';
  render();
  if (!localStorage.getItem(SEEN_KEY)) openWelcomeModal();
  if (localStorage.getItem(SYNC_KEY) === '1') startSync();
  window.addEventListener('online', () => render());
  window.addEventListener('offline', () => render());
  // Register service worker (PWA)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}
boot();
</script>
