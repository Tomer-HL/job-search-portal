<title>JobTrack · מעקב חיפוש עבודה</title>
<style>
:root {
  --bg:#f6f7fb; --panel:#ffffff; --border:#e6e9ef; --text:#1f2937; --muted:#6b7280;
  --primary:#0073ea; --primary-dk:#0060c2; --accent:#5559df;
  --st-saved:#6b7280; --st-applied:#1b66c9; --st-phone:#8a3fc4; --st-interview:#a85a00;
  --st-offer:#0a7d4f; --st-rejected:#c62a42; --st-withdrawn:#5f707a; --st-archived:#cfd2d9;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 18px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.12);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Heebo","Assistant",sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
:root[dir=rtl] .lr-flip{transform:scaleX(-1)}

/* Top bar */
.topbar{background:linear-gradient(135deg,#0073ea 0%,#5559df 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.topbar h1 .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.topbar h1 .sub{font-weight:400;opacity:.85;font-size:12px;margin-inline-start:8px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{background:#fff;color:var(--primary);border-color:#fff}
.btn.primary:hover{background:#f0f6ff}
.btn.danger{background:#c62a42;border-color:#c62a42}
.btn.ghost{background:transparent;border-color:#d2d6de;color:var(--text)}
.btn.ghost:hover{background:#f0f2f7}
.btn.success{background:#0a7d4f;border-color:#0a7d4f}
.btn.small{padding:5px 9px;font-size:11px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.15);font-size:12px;cursor:pointer}
.sync-chip:hover{background:rgba(255,255,255,.25)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#cfd2d9;display:inline-block}
.sync-dot.online{background:#00c875;animation:pulse 2s infinite}
.sync-dot.offline{background:#fdab3d}
.sync-dot.error{background:#e2445c}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.lang-toggle{display:inline-flex;background:rgba(255,255,255,.15);border-radius:14px;overflow:hidden;font-size:11px;font-weight:700}
.lang-toggle button{border:0;background:transparent;color:#fff;padding:5px 11px;cursor:pointer;opacity:1}
.lang-toggle button.active{background:rgba(255,255,255,.85);color:var(--primary);opacity:1}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:18px 22px 4px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .value{font-size:26px;font-weight:700;margin-top:4px}
.stat.applied .value{color:var(--st-applied)}
.stat.interview .value{color:var(--st-interview)}
.stat.offer .value{color:var(--st-offer)}
.stat.rejected .value{color:var(--st-rejected)}
.stat .delta{font-size:11px;color:var(--muted);margin-top:2px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px;flex-wrap:wrap}
.toolbar input[type=search],.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text)}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:400px}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.view-toggle button{border:0;background:#fff;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.view-toggle button.active{background:var(--primary);color:#fff}
.spacer{flex:1}

.container{padding:0 22px 60px}

/* Table */
.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:#f6f7fb;text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{background:#eef1f6}
thead th .sort-arrow{opacity:.4;margin-inline-start:4px;font-size:10px}
thead th.sorted .sort-arrow{opacity:1;color:var(--primary)}
tbody td{padding:10px 12px;border-bottom:1px solid #f1f3f7;vertical-align:middle;font-size:13px}
tbody tr:hover{background:#fafbff}
tbody tr.archived td{opacity:.62}
.cell-company{font-weight:600;color:var(--text)}
.cell-link a{color:var(--primary);text-decoration:none;font-size:12px}
.cell-link a:hover{text-decoration:underline}
.cell-notes{max-width:340px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:4px}
.icon-btn{border:0;background:transparent;padding:4px 6px;border-radius:4px;color:var(--muted);font-size:14px;cursor:pointer}
.icon-btn:hover{background:#eef1f6;color:var(--text)}
.icon-btn.del:hover{background:#fdecef;color:var(--st-rejected)}

/* Status pills */
.pill{display:inline-block;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pill.saved{background:var(--st-saved)}
.pill.applied{background:var(--st-applied)}
.pill.phone-screen{background:var(--st-phone)}
.pill.interview{background:var(--st-interview)}
.pill.offer{background:var(--st-offer)}
.pill.rejected{background:var(--st-rejected)}
.pill.withdrawn{background:var(--st-withdrawn)}
.pill.archived{background:var(--st-archived);color:#374151}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kanban .col{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);min-height:120px}
.kanban .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kanban .col-h .count{background:#eef1f6;color:var(--muted);padding:2px 8px;border-radius:10px;font-size:11px}
.kanban .card{background:#fafbff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.kanban .card:hover{box-shadow:0 2px 8px rgba(0,115,234,.15);transform:translateY(-1px)}
.kanban .card .company{font-weight:700;font-size:13px;color:var(--text)}
.kanban .card .role{font-size:12px;color:var(--muted);margin-top:2px}
.kanban .card .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:760px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h2{margin:0;font-size:18px}
.modal-h .close{border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px}
.modal-h .close:hover{background:#eef1f6;color:var(--text)}
.modal-b{padding:18px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px}
.field input, .field select, .field textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text);font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-help{font-size:11px;color:var(--muted);margin-top:4px}

/* Welcome modal */
.welcome-hero{background:linear-gradient(135deg,#0073ea 0%,#5559df 100%);color:#fff;padding:36px 28px;text-align:center;border-radius:14px 14px 0 0}
.welcome-hero .emoji{font-size:48px;margin-bottom:8px;line-height:1}
.welcome-hero h2{margin:0 0 8px;font-size:24px}
.welcome-hero p{margin:0;opacity:.92;font-size:14px}
.welcome-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:24px}
.welcome-feature{background:#f6f7fb;border-radius:10px;padding:14px;text-align:center}
.welcome-feature .ico{font-size:24px;margin-bottom:6px}
.welcome-feature .t{font-weight:700;font-size:13px;margin-bottom:3px}
.welcome-feature .d{font-size:12px;color:var(--muted)}
.welcome-tips{padding:0 24px 18px;font-size:13px;color:var(--text);line-height:1.6}
.welcome-tips ul{padding-inline-start:18px;margin:6px 0 0}
.welcome-tips li{margin-bottom:4px}

/* Sync modal */
.sync-status{padding:14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.sync-status.local{background:#eef1f6;color:var(--muted)}
.sync-status.online{background:#dff5e7;color:#0a5d35}
.sync-section{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.sync-section h3{margin:0 0 8px;font-size:14px}
.sync-section .step{font-size:12px;color:var(--muted);margin-bottom:6px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ico{font-size:48px;margin-bottom:10px}
.empty h3{margin:0 0 4px;color:var(--text)}
.empty p{margin:0 0 14px}

/* Toast */
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:#1f2937;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#0a7d4f}
.toast.error{background:#c62a42}

@media (max-width:640px){
  .topbar{padding:11px 14px}

  .container{padding:0 14px 60px}
  .lang-toggle button{padding:4px 8px}
}

.skip-link:focus{top:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
main:focus{outline:none}
button.sync-chip{border:0;color:#fff;font:inherit;font-size:12px}
.topbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.1)}

.th-btn{background:none;border:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0}
tbody tr.archived td{opacity:.8}
.mobile-only{display:none}
details.more{margin:6px 0 2px;border:1px solid var(--border);border-radius:8px;padding:2px 12px}
details.more>summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--text)}
details.more .field{margin-top:8px}
.app-footer{padding:18px 22px 40px;font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.app-footer a,.linklike{color:#0050a8;background:none;border:0;padding:6px 2px;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.legal h3{font-size:14px;margin:16px 0 4px}
.legal p,.legal li{font-size:13px;line-height:1.65;color:var(--text);margin:4px 0}
.legal ul{margin:4px 0;padding-inline-start:20px}
.legal .upd{font-size:11px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;margin:12px 0}
.consent input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.btn.google{background:#fff;color:#1f2937;border:1px solid #747775;font-size:14px;padding:10px 16px}
.btn.google:disabled{opacity:.55;cursor:not-allowed}
.acct{display:flex;gap:10px;align-items:center;margin:8px 0 14px;font-size:13px}
.acct b{display:block}
@media (pointer:coarse),(max-width:640px){
  .btn,.icon-btn,.lang-toggle button,.view-toggle button,button.sync-chip,.th-btn{min-height:44px}
  .icon-btn{min-width:44px;font-size:16px}
  .lang-toggle button{min-width:44px}
  .toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{min-height:44px;font-size:16px}
}
@media (max-width:640px){
  .hide-mobile{display:none!important}
  .mobile-only{display:inline-block}
  .topbar{flex-wrap:wrap}
  .toolbar .spacer{display:none}
  .toolbar select,.toolbar input[type=search]{flex:1 1 100%;max-width:none}
  .view-toggle{flex:1 1 100%}.view-toggle button{flex:1}
  .container{padding:0 14px 40px}
  .tablewrap{border:0;background:transparent;box-shadow:none;overflow:visible}
  table{min-width:0;display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  tbody{display:block}
  tbody tr{display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:0 0 10px;padding:8px 12px;box-shadow:var(--shadow)}
  tbody td{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border:0;white-space:normal;max-width:none;text-align:end}
  tbody td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:start;flex:0 0 36%}

  .cell-notes{white-space:normal;overflow:visible;text-overflow:clip}
  .row-actions{margin-inline-start:auto}
  .kanban{grid-template-columns:1fr}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-width:none;max-height:94vh;border-radius:16px 16px 0 0}
  .modal .row{flex-direction:column;gap:10px}
  .toast{inset-inline:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- State ---------- */
let DATA = [];
let UI = { view:'table', search:'', filterStatus:'all', filterArchived:'active', sortBy:'updatedAt', sortDir:'desc' };
let LANG = 'he';

/* ---------- Helpers ---------- */
const t = (key) => I18N[LANG][key] || key;
const uid = () => 'j' + Math.random().toString(36).slice(2,11) + Date.now().toString(36).slice(-4);
const escapeHtml = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(LANG==='he'?'he-IL':'en-US') : '';
const todayISO = () => new Date().toISOString().slice(0,10);
const isArchived = (r) => r.archived === true || r.status === 'archived';
const EXTRA_FIELDS = ['connection','interviewer','interviewRound','nextInterview','prepNotes','resumeVersion','coverLetter','portfolio','salary'];
function normalizeRecord(r){
  const o = { ...r };
  if (!o.id) o.id = uid();
  o.id = String(o.id).replace(/[\/\s]+/g, '_');
  if (!o.appliedAt && o.dateApplied) o.appliedAt = o.dateApplied;
  return o;
}
function toCloud(r){ const o = { ...r }; if (o.appliedAt) o.dateApplied = o.appliedAt; return JSON.parse(JSON.stringify(o)); }
function sigOf(r){ const o = toCloud(r); return JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]])); }
function announce(msg){ const l = document.getElementById('live'); if (l){ l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 60); } }


function loadState(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) DATA = JSON.parse(raw).map(normalizeRecord); } catch(e){ DATA = []; }
  try { const raw = localStorage.getItem(UI_KEY); if (raw) Object.assign(UI, JSON.parse(raw)); } catch(e){}
  LANG = localStorage.getItem(LANG_KEY) || 'he';
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  if (syncEnabled) uploadDiff();
}
function saveUI(){ localStorage.setItem(UI_KEY, JSON.stringify(UI)); }
function setLang(l){ LANG = l; localStorage.setItem(LANG_KEY, l); document.documentElement.lang = l; document.documentElement.dir = l==='he'?'rtl':'ltr'; render(); }

/* ---------- Toast ---------- */
function toast(msg, type=''){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); document.body.appendChild(el); }
  el.textContent = msg; announce(msg); el.className = 'toast show ' + type;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.className = 'toast ' + type; }, 2400);
}

/* ---------- Filters / sort ---------- */
function applyFilters(){
  let rows = DATA.slice();
  if (UI.filterArchived === 'active') rows = rows.filter(r => !isArchived(r));
  else if (UI.filterArchived === 'archived') rows = rows.filter(r => isArchived(r));
  if (UI.filterStatus !== 'all') rows = rows.filter(r => r.status === UI.filterStatus);
  const q = (UI.search||'').trim().toLowerCase();
  if (q) rows = rows.filter(r => [r.company,r.jobTitle,r.location,r.notes,r.connection].some(v => (v||'').toLowerCase().includes(q)));
  const dir = UI.sortDir === 'asc' ? 1 : -1;
  rows.sort((a,b) => {
    const av = a[UI.sortBy] || ''; const bv = b[UI.sortBy] || '';
    return av < bv ? -1*dir : av > bv ? 1*dir : 0;
  });
  return rows;
}
function getStats(){
  const active = DATA.filter(r => !isArchived(r));
  return {
    total: DATA.length,
    active: active.length,
    interviews: active.filter(r => r.status === 'interview' || r.status === 'phone-screen').length,
    offers: active.filter(r => r.status === 'offer').length,
    rejected: active.filter(r => r.status === 'rejected').length,
  };
}

/* ---------- Render ---------- */
function syncChipInfo(){
  if (syncState === 'connecting') return { cls:'', text:t('syncConnecting') };
  if (syncEnabled && syncState === 'error') return { cls:'error', text:t('syncErrorLabel') };
  if (syncEnabled && !navigator.onLine) return { cls:'offline', text:t('offlineLabel') };
  if (syncEnabled) return { cls:'online', text:t('syncedLabel') };
  return { cls:'', text:t('signInSync') };
}
function render(){
  const app = document.getElementById('app');
  // remember focus so keyboard / screen-reader users keep their place after a re-render
  const ae = document.activeElement; let keep = null;
  if (ae && app.contains(ae)){
    if (ae.id) keep = '#' + ae.id;
    else if (ae.dataset && ae.dataset.sort) keep = '[data-sort="' + ae.dataset.sort + '"]';
    else if (ae.dataset && ae.dataset.view) keep = '[data-view="' + ae.dataset.view + '"]';
    else if (ae.dataset && ae.dataset.lang) keep = '[data-lang="' + ae.dataset.lang + '"]';
  }
  const stats = getStats();
  const rows = applyFilters();
  const chip = syncChipInfo();
  const sortOpts = [['updatedAt', t('updated')], ['appliedAt', t('applied')], ['company', t('company')], ['status', t('status')]];
  app.innerHTML = `
    <a class="skip-link" href="#main">${t('skipToContent')}</a>
    <div class="topbar" role="banner">
      <h1><span class="logo" aria-hidden="true">📋</span>${t('appName')}<span class="sub">${t('tagline')}</span></h1>

        <div class="lang-toggle" role="group" aria-label="${t('language')}">
          <button type="button" class="${LANG==='he'?'active':''}" data-lang="he" lang="he" aria-label="עברית" aria-pressed="${LANG==='he'}">עב</button>
          <button type="button" class="${LANG==='en'?'active':''}" data-lang="en" lang="en" aria-label="English" aria-pressed="${LANG==='en'}">EN</button>
        </div>
        <button type="button" class="sync-chip" id="sync-chip" aria-haspopup="dialog"><span class="sync-dot ${chip.cls}" aria-hidden="true"></span>${chip.text}</button>
        <button type="button" class="btn ghost small hide-mobile" id="btn-import"><span aria-hidden="true">⬆</span> ${t('import')}</button>
        <button type="button" class="btn ghost small hide-mobile" id="btn-export"><span aria-hidden="true">⬇</span> ${t('export')}</button>
        <button type="button" class="btn ghost small" id="btn-settings"><span aria-hidden="true">⚙</span> ${t('settings')}</button>
        <button type="button" class="btn primary" id="btn-add"><span aria-hidden="true">+</span> ${t('addJob')}</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">${t('total')}</div><div class="value">${stats.total}</div></div>
      <div class="stat applied"><div class="label">${t('activeApps')}</div><div class="value">${stats.active}</div></div>
      <div class="stat interview"><div class="label">${t('interviews')}</div><div class="value">${stats.interviews}</div></div>
      <div class="stat offer"><div class="label">${t('offers')}</div><div class="value">${stats.offers}</div></div>
      <div class="stat rejected"><div class="label">${t('rejected')}</div><div class="value">${stats.rejected}</div></div>
    </div>

    <div class="toolbar" role="search">
      <input type="search" id="search" placeholder="${t('search')}" aria-label="${t('search')}" autocomplete="off" value="${escapeHtml(UI.search)}">
      <select id="filterStatus" aria-label="${t('status')}">
        <option value="all">${t('allStatuses')}</option>
        ${STATUSES.map(s => `<option value="${s.key}" ${UI.filterStatus===s.key?'selected':''}>${LANG==='he'?s.labelHe:s.labelEn}</option>`).join('')}
      </select>
      <select id="filterArchived" aria-label="${t('includeArchived')}">
        <option value="active" ${UI.filterArchived==='active'?'selected':''}>${t('activeOnly')}</option>
        <option value="all" ${UI.filterArchived==='all'?'selected':''}>${t('includeArchived')}</option>
        <option value="archived" ${UI.filterArchived==='archived'?'selected':''}>${t('onlyArchived')}</option>
      </select>
      ${UI.view==='table' ? `<select id="sortSel" class="mobile-only" aria-label="${t('sortBy')}">${sortOpts.map(o => `<option value="${o[0]}" ${UI.sortBy===o[0]?'selected':''}>${t('sortBy')}: ${o[1]}</option>`).join('')}</select>` : ''}
      <div class="spacer"></div>
      <div class="view-toggle" role="group" aria-label="${t('table')} / ${t('kanban')}">
        <button type="button" class="${UI.view==='table'?'active':''}" data-view="table" aria-pressed="${UI.view==='table'}">${t('table')}</button>
        <button type="button" class="${UI.view==='kanban'?'active':''}" data-view="kanban" aria-pressed="${UI.view==='kanban'}">${t('kanban')}</button>
      </div>
    </div>

    <main class="container" id="main" tabindex="-1">
      ${rows.length === 0 && DATA.length === 0 ? renderEmpty() :
        rows.length === 0 ? `<div class="empty"><div class="ico" aria-hidden="true">🔍</div><h2>${LANG==='he'?'אין תוצאות':'No results'}</h2><p>${LANG==='he'?'נסה לשנות את הסינון':'Try adjusting your filters'}</p></div>` :
        UI.view==='table' ? renderTable(rows) : renderKanban(rows)}
    </main>
    <footer class="app-footer">
      <span>JobTrack · v2.0</span>

  return `<div class="empty">
    <div class="ico">🚀</div>
    <h3>${t('emptyTitle')}</h3>
    <p>${t('emptyDesc')}</p>
    <button class="btn primary" id="btn-add-empty" style="background:var(--primary);color:#fff;border-color:var(--primary)">+ ${t('addFirstJob')}</button>

function statusLabel(k){ const s = STATUSES.find(x => x.key === k); return s ? (LANG==='he' ? s.labelHe : s.labelEn) : '—'; }
function methodLabel(k){ const m = METHODS.find(x => x.key === k); return m ? (LANG==='he' ? m.labelHe : m.labelEn) : ''; }
function renderTable(rows){

    {k:'jobTitle', l:t('role')},
    {k:'status', l:t('status')},
    {k:'method', l:t('method')},
    {k:'location', l:t('location')},

    {k:'updatedAt', l:t('updated')},
    {k:'notes', l:t('notes')},
  ];
  const ariaSort = (k) => UI.sortBy===k ? (UI.sortDir==='asc' ? 'ascending' : 'descending') : 'none';
  return `<div class="tablewrap"><table>

      ${cols.map(c => `<th scope="col" aria-sort="${ariaSort(c.k)}" class="${UI.sortBy===c.k?'sorted':''}"><button type="button" class="th-btn" data-sort="${c.k}">${c.l}<span class="sort-arrow" aria-hidden="true">${UI.sortBy===c.k?(UI.sortDir==='asc'?'▲':'▼'):'⇅'}</span></button></th>`).join('')}

      ${rows.map(r => `<tr class="${isArchived(r)?'archived':''}">

        <td data-label="${t('role')}"><span>${escapeHtml(r.jobTitle||'')}${r.link?` <a href="${escapeHtml(r.link)}" target="_blank" rel="noopener" class="cell-link" aria-label="${t('openLink')}: ${escapeHtml(r.company||'')} (${t('newTab')})">↗</a>`:''}</span></td>

        </div></td>
      </tr>`).join('')}

  </table></div>`;
}

function renderKanban(rows){
  const cols = STATUSES.filter(s => s.key !== 'archived');
  return `<div class="kanban">${cols.map(s => {

/* ---------- Modal infrastructure ---------- */
let lastFocus = null;
function openModal(html){
  const had = document.getElementById('modal-bg');
  closeModal(true);
  if (!had) lastFocus = document.activeElement;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modal-bg';
  bg.innerHTML = html;
  const dlg = bg.querySelector('.modal');
  if (dlg){
    dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
    const h = dlg.querySelector('h2');
    if (h){ h.id = 'modal-title'; dlg.setAttribute('aria-labelledby', 'modal-title'); }
  }
  // associate labels with their controls (programmatic labels for screen readers)
  bg.querySelectorAll('label').forEach(l => {
    if (l.htmlFor || l.querySelector('input,select,textarea')) return;
    const n = l.nextElementSibling;
    if (n && /^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName) && n.id) l.htmlFor = n.id;
  });
  bg.querySelectorAll('.close').forEach(b => b.setAttribute('aria-label', t('close')));
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  bg.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.stopPropagation(); closeModal(); return; }
    if (e.key === 'Tab'){
      const f = [...bg.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,summary')].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  document.body.appendChild(bg);
  bg.querySelectorAll('.close,[data-close]').forEach(b => { b.onclick = () => closeModal(); });
  const first = bg.querySelector('input:not([type=checkbox]):not([type=file]),textarea') || bg.querySelector('button');
  if (first) first.focus();
  return bg;
}
function closeModal(silent){
  const m = document.getElementById('modal-bg');
  if (!m) return;
  m.remove();
  if (silent !== true && lastFocus && document.contains(lastFocus)){ try { lastFocus.focus(); } catch(_){} }
}

/* ---------- Cloud sync (Google sign-in + Firestore) ---------- */
function loadFirebase(){
  if (fbReady) return fbReady;
  fbReady = (async () => {
    const [appM, authM, fsM] = await Promise.all([
      import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js'), import(FB_SDK + 'firebase-firestore.js')
    ]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    let db;
    try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch(e){ db = fsM.getFirestore(app); }
    fb = { app, auth, db, fa: authM, fs: fsM };
    authM.onAuthStateChanged(auth, onAuthChanged);
    return fb;
  })().catch(e => { fbReady = null; throw e; });
  return fbReady;
}
async function startSync(){
  try {
    syncState = 'connecting'; render();
    await loadFirebase();
    fb.fa.getRedirectResult(fb.auth).catch(e => { toast(authErrorText(e), 'error'); });
  } catch(e){
    console.error(e);
    syncEnabled = false; syncState = navigator.onLine ? 'error' : 'local'; render();
  }
}
function authErrorText(e){
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return t('errDomain');
  if (c === 'auth/network-request-failed') return t('errNetwork');
  if (c === 'auth/popup-blocked') return t('errPopup');
  return t('errAuth');
}
async function signInWithGoogle(){
  syncState = 'connecting'; render();
  try {
    await loadFirebase();
    const provider = new fb.fa.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    localStorage.setItem(SYNC_KEY, '1');
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
    if (standalone){ await fb.fa.signInWithRedirect(fb.auth, provider); return; }
    try { await fb.fa.signInWithPopup(fb.auth, provider); }
    catch(e){
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){ await fb.fa.signInWithRedirect(fb.auth, provider); return; }
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'){
        if (!currentUser){ localStorage.removeItem(SYNC_KEY); syncState = 'local'; } else { syncState = 'online'; }
        render(); return;
      }
      throw e;
    }
  } catch(e){
    console.error(e); localStorage.removeItem(SYNC_KEY);
    syncEnabled = false; syncState = 'local'; render(); toast(authErrorText(e), 'error');
  }
}
function onAuthChanged(user){
  currentUser = user;
  if (unsubscribe){ unsubscribe(); unsubscribe = null; }
  cloudShadow = new Map();
  if (!user){ syncEnabled = false; syncState = 'local'; render(); return; }
  const prev = localStorage.getItem(UID_KEY);
  if (prev && prev !== user.uid){ // a different account used this device: never mix their data
    DATA = []; localStorage.setItem(STORAGE_KEY, '[]'); localStorage.removeItem(SYNCED_KEY);
  }
  localStorage.setItem(UID_KEY, user.uid);
  localStorage.setItem(SYNC_KEY, '1');
  syncEnabled = true; syncState = 'connecting'; render();
  const { collection, onSnapshot } = fb.fs;
  unsubscribe = onSnapshot(collection(fb.db, 'users', user.uid, CLOUD_COLLECTION), handleSnapshot, (err) => {
    console.error(err); syncState = 'error'; render();
    toast(err && err.code === 'permission-denied' ? t('rulesDenied') : t('syncErrorLabel'), 'error');
  });
}
function loadSynced(){ try { return new Set(JSON.parse(localStorage.getItem(SYNCED_KEY) || '[]')); } catch(e){ return new Set(); } }
function handleSnapshot(snap){
  const cloud = snap.docs.map(d => normalizeRecord({ ...d.data(), id: d.id }));
  const cloudIds = new Set(cloud.map(r => r.id));
  const trusted = !snap.metadata.fromCache;       // server-confirmed view: a record missing from it was deleted elsewhere
  const synced = loadSynced();
  // keep local records the cloud has never seen (first sign-in / offline-created); drop ones deleted on another device
  const localKeep = DATA.filter(r => !cloudIds.has(r.id) && (!trusted || !synced.has(r.id)));
  DATA = cloud.concat(localKeep);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  cloudShadow = new Map(cloud.map(r => [r.id, sigOf(r)]));
  if (trusted) localStorage.setItem(SYNCED_KEY, JSON.stringify([...cloudIds]));
  syncState = 'online'; render();
  if (trusted) uploadDiff();
}
function onWriteError(e){
  console.error(e); syncState = 'error'; render();
  toast(e && e.code === 'permission-denied' ? t('rulesDenied') : t('syncErrorLabel'), 'error');
}
function uploadDiff(){
  if (!fb || !currentUser || !syncEnabled) return;
  const { doc, setDoc, deleteDoc } = fb.fs, u = currentUser.uid;
  const ids = new Set();
  DATA.forEach(r => {
    ids.add(r.id);
    const sg = sigOf(r);
    if (cloudShadow.get(r.id) !== sg){
      cloudShadow.set(r.id, sg);
      try { setDoc(doc(fb.db, 'users', u, CLOUD_COLLECTION, r.id), toCloud(r)).catch(onWriteError); } catch(e){ onWriteError(e); }
    }
  });
  [...cloudShadow.keys()].forEach(id => {
    if (!ids.has(id)){
      cloudShadow.delete(id);
      try { deleteDoc(doc(fb.db, 'users', u, CLOUD_COLLECTION, id)).catch(onWriteError); } catch(e){ onWriteError(e); }
    }
  });
}
function resetLocalAccountState(){
  DATA = []; localStorage.setItem(STORAGE_KEY, '[]');
  [SYNC_KEY, SYNCED_KEY, UID_KEY].forEach(k => localStorage.removeItem(k));
  syncEnabled = false; syncState = 'local'; currentUser = null; cloudShadow = new Map();
}
async function signOutUser(){
  if (!confirm(t('signOutConfirm'))) return;
  try { if (unsubscribe){ unsubscribe(); unsubscribe = null; } await fb.fa.signOut(fb.auth); } catch(e){ console.error(e); }
  resetLocalAccountState(); closeModal(true); render(); toast(t('signedOut'), 'success');
}
async function deleteMyData(){
  if (!fb || !currentUser) return;
  if (!confirm(t('deleteConfirm'))) return;
  const user = currentUser;
  try {
    if (unsubscribe){ unsubscribe(); unsubscribe = null; }
    const { collection, getDocs, writeBatch } = fb.fs;
    const snap = await getDocs(collection(fb.db, 'users', user.uid, CLOUD_COLLECTION));
    let batch = writeBatch(fb.db), n = 0;
    for (const d of snap.docs){ batch.delete(d.ref); if (++n % 400 === 0){ await batch.commit(); batch = writeBatch(fb.db); } }
    await batch.commit();
    try { await fb.fa.deleteUser(user); }
    catch(e){
      if (e.code === 'auth/requires-recent-login'){ await fb.fa.reauthenticateWithPopup(user, new fb.fa.GoogleAuthProvider()); await fb.fa.deleteUser(user); }
      else throw e;
    }
    resetLocalAccountState(); closeModal(true); render(); toast(t('deletedAll'), 'success');
  } catch(e){
    console.error(e); toast(authErrorText(e), 'error');
    if (fb.auth.currentUser) onAuthChanged(fb.auth.currentUser);   // resume syncing if the account still exists
  }
}

/* ---------- Boot ---------- */
function boot(){
  loadState();
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='he'?'rtl':'ltr';
  render();
  if (!localStorage.getItem(SEEN_KEY)) openWelcomeModal();
  if (localStorage.getItem(SYNC_KEY) === '1') startSync();
  window.addEventListener('online', () => render());
  window.addEventListener('offline', () => render());
  // Register service worker (PWA)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}
boot();
</script>
